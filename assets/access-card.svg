      <text x="760" y="101" font-size="12" fill="#c8dfd0">PRIMARY   PYTHON / LINUX / NETWORKS</text>
      <text x="760" y="124" font-size="12" fill="#c8dfd0">CLOUD     AWS / TERRAFORM / CI-CD</text>
      <text x="760" y="147" font-size="12" fill="#c8dfd0">OFFSEC    WEB / AD / PRIVESC</text>
      <text x="760" y="170" font-size="12" fill="#c8dfd0">OT/ICS    MODBUS / SCADA / PLC</text>
      <text x="760" y="193" font-size="12" fill="#c8dfd0">MODE      LAB-FIRST / EVIDENCE-DRIVEN</text>
    </g>

    <g>
