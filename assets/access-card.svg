      <text x="320" y="294" font-size="15" fill="#ddf8e4" letter-spacing="2">CCNA  →  RHCSA  →  AWS SAA  →  PEN-200 / OSCP+</text>
      <text x="320" y="318" font-size="10" fill="#4f9367">SUPPORT:  NSE 1/2/3 · PYTHON · BASH · C/C++ · TERRAFORM · OT/ICS</text>
    </g>

    <g clip-path="url(#clip)">
      <rect x="0" y="344" width="1200" height="16" fill="#020504"/>
      <text x="1190" y="355" font-size="11" fill="#2e6241">0x41414141   0xdeadbeef   PCAP   KERNEL   IAM   MODBUS   SIGMA   TERRAFORM   SEGMENTATION   RE-TEST   </text>
    </g>

    <rect x="0" y="-50" width="1200" height="7" fill="#00ff66" opacity=".08">
      <animate attributeName="y" values="-50;390" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
