
<svg viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="52%" stop-color="#0f2a19"/>
      <stop offset="100%" stop-color="#ff2b2b"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eafff0"/>
      <stop offset="45%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#ff5a5a"/>
    </linearGradient>
    <radialGradient id="radar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2b2b" stop-opacity=".50"/>
      <stop offset="100%" stop-color="#ff2b2b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="2" y="2" width="1196" height="356" rx="20"/></clipPath>
    <clipPath id="radarClip"><circle cx="160" cy="188" r="112"/></clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="20" fill="#020504" stroke="url(#edge)" stroke-width="2"/>
  <rect x="8" y="8" width="1184" height="344" rx="15" fill="none" stroke="#0b2014" stroke-width="1"/>

  <g clip-path="url(#clip)">
