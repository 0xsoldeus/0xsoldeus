    <rect x="453" y="174" width="125" height="28" rx="4" fill="#170202" stroke="#ff2b2b"/>
    <circle cx="469" cy="188" r="5" fill="#ff2b2b" filter="url(#glowRed)"><animate attributeName="opacity" values="1;.25;1" dur=".85s" repeatCount="indefinite"/></circle>
    <text x="485" y="193" font-size="12" fill="#ff9a9a" letter-spacing="2">ATTACK</text>

    <rect x="588" y="174" width="125" height="28" rx="4" fill="#03140a" stroke="#00b050"/>
    <circle cx="604" cy="188" r="5" fill="#00ff66" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <text x="620" y="193" font-size="12" fill="#9affb6" letter-spacing="2">DETECT</text>

    <rect x="318" y="212" width="395" height="24" rx="4" fill="#06100a" stroke="#214d32"/>
    <circle cx="334" cy="224" r="4" fill="#00ff66" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="348" y="228" font-size="11" fill="#7fff9e" letter-spacing="1.7">LAB STATUS  /  CONTROLLED  /  ROOT ACCESS</text>

