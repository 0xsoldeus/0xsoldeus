      <circle cx="160" cy="188" r="78" fill="none" stroke="#0b2a19"/>
      <circle cx="160" cy="188" r="40" fill="none" stroke="#0b2a19"/>
      <line x1="48" y1="188" x2="272" y2="188" stroke="#0b2a19"/>
      <line x1="160" y1="76" x2="160" y2="300" stroke="#0b2a19"/>
