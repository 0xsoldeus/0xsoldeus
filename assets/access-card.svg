      <text x="312" y="121" font-size="68" fill="#00ff66" opacity=".55" filter="url(#glow)"><animate attributeName="x" values="312;307;315;312" dur="3.2s" repeatCount="indefinite"/>SOLDEUS</text>
      <text x="316" y="121" font-size="68" fill="url(#title)">SOLDEUS</text>
