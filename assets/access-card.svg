      <text x="219" y="149" font-size="10" fill="#8dffb0">DC01</text>

      <circle cx="118" cy="230" r="5" fill="#ff2b2b" filter="url(#glowRed)"><animate attributeName="opacity" values=".2;1;.2" dur="1.7s" repeatCount="indefinite"/></circle>
      <text x="79" y="246" font-size="10" fill="#ff8888">ROOT</text>

      <circle cx="205" cy="244" r="4" fill="#d9bb75"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="214" y="258" font-size="10" fill="#d9c48a">SRV-07</text>

      <text x="160" y="319" text-anchor="middle" font-size="10" fill="#2e6241" letter-spacing="3">NETWORK VISIBILITY</text>
