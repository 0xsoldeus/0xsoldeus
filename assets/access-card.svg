    </circle>
    <text x="38" y="21" font-size="11" fill="#00b050" letter-spacing="2">SYSTEM ONLINE</text>
    <text x="196" y="21" font-size="11" fill="#244f35">│</text>
    <text x="216" y="21" font-size="11" fill="#4fd07f" letter-spacing="2">LAB / LOCAL / CLOUD</text>
    <text x="454" y="21" font-size="11" fill="#244f35">│</text>
    <text x="474" y="21" font-size="11" fill="#00b050" letter-spacing="2">BUILD→ATTACK→DETECT→HARDEN</text>
    <text x="1168" y="21" text-anchor="end" font-size="10" fill="#ff5a5a" letter-spacing="1.5">AUTHORIZED ONLY</text>

    <g opacity=".32" fill="#0f7a3a" font-size="12">
      <text x="330" y="65">ptrace</text><text x="510" y="85">mmap</text><text x="990" y="64">execve</text>
      <text x="365" y="110">ioctl</text><text x="530" y="125">kprobe</text><text x="1000" y="108">clone</text>
      <text x="340" y="300">systemd</text><text x="550" y="322">iptables</text><text x="1005" y="298">auditd</text>
    </g>

